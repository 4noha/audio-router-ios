name: AudioRouterCompanion
options:
  bundleIdPrefix: com.fournoha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: ja

targets:
  AudioRouterCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AudioRouterCompanion
        excludes:
          - "Resources/Info.plist"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: AudioRouterCompanion/Resources/Info.plist
      properties:
        CFBundleName: AudioRouter
        CFBundleDisplayName: AudioRouter
        CFBundleShortVersionString: "0.3.1"
        CFBundleVersion: "14"
        # AppIcon は Asset Catalog の AppIcon.appiconset を使う宣言。
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Permissions
        NSMicrophoneUsageDescription: "Mac のAudioRouter へマイク音を送信するため使用します。"
        NSLocalNetworkUsageDescription: "Mac のAudioRouter を LAN で見つけて接続するため使用します。"
        NSBonjourServices:
          - "_4noha-audio._udp"
        # バックグラウンドでも mic キャプチャと UDP 送受信を続けるため。
        UIBackgroundModes:
          - audio
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        # iPhone only にして iPad 制約 (orientation 4方向必須・152px icon 必須) を回避。
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.fournoha.audiorouter.ios
        # DEVELOPMENT_TEAM は git 管理外の local.xcconfig に書く（Config.xcconfig が読む）。
        # ここに書くと xcconfig より優先されるので書かない。
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
